name: build
on:
  push:
  workflow_dispatch:
permissions:
  contents: write # needed to commit the android folder and to publish releases
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
      - name: Show signing key fingerprint
        run: keytool -list -keystore ~/.android/debug.keystore -storepass android | grep -iE "androiddebugkey|fingerprint"
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Check JavaScript syntax
        continue-on-error: true
        run: |
          for f in www/*.js; do node --check "$f"; done
      - name: Add Android project if missing
        id: android
        run: |
          if [ -d android ]; then
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            npx cap add android
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Turn off Android backup (security.md)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          if grep -q 'android:allowBackup=' "$M"; then
            sed -i 's/android:allowBackup="[a-z]*"/android:allowBackup="false"/' "$M"
          else
            sed -i 's/<application/<application android:allowBackup="false"/' "$M"
          fi
          grep -n 'allowBackup' "$M"
      - name: Commit generated Android project (first build only)
        if: steps.android.outputs.created == 'true' && !startsWith(github.ref, 'refs/tags/')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android
          git commit -m "chore: add generated Android project"
          git pull --rebase
          git push
      - name: Sync web files into the Android project
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Show APK signing certificate
        continue-on-error: true
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA-256"
      - name: List APK files
        run: find android -name "*.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Publish release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "app-$TAG.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "app-$TAG.apk" --clobber
          else
            gh release create "$TAG" "app-$TAG.apk" --generate-notes
          fi

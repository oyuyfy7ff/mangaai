<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://openrouter.ai">
  <title>Manga AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="appbar"><h1 id="title">เขียน</h1></header>

  <main class="screen" id="screen-write">
    <div class="tabs" id="role-tabs" role="tablist">
      <button type="button" role="tab" data-role="editor" aria-selected="true">บรรณาธิการ</button>
      <button type="button" role="tab" data-role="screenwriter" aria-selected="false">นักเขียนบท</button>
    </div>
    <div class="field">
      <label for="w-draft">ร่างของคุณ</label>
      <textarea id="w-draft" rows="8" placeholder="วางร่างเรื่อง ฉาก หรือบทพูดที่นี่"></textarea>
      <p class="error" id="w-err" hidden></p>
    </div>
    <button type="button" class="block" id="w-send">ส่ง</button>
    <p class="muted small" id="w-busy" hidden>กำลังรอคำตอบ</p>
    <div class="chat" id="w-out"></div>
  </main>

  <main class="screen" id="screen-story" hidden>
    <div class="field">
      <label for="st-name">ชื่อตัวละคร</label>
      <input id="st-name" type="text" maxlength="50" autocomplete="off">
    </div>
    <div class="field">
      <label for="st-desc">รายละเอียด (ไม่บังคับ)</label>
      <textarea id="st-desc" rows="2" maxlength="500"></textarea>
      <p class="error" id="st-err" hidden></p>
    </div>
    <button type="button" class="block" id="st-add">เพิ่มตัวละคร</button>
    <ul class="list" id="st-list"></ul>
    <p class="empty" id="st-empty">ยังไม่มีตัวละคร</p>

    <div class="field">
      <label for="st-q">ถาม AI เกี่ยวกับเรื่อง</label>
      <textarea id="st-q" rows="3"></textarea>
      <p class="error" id="st-q-err" hidden></p>
    </div>
    <button type="button" class="block soft" id="st-ask">ถาม</button>
    <p class="muted small" id="st-busy" hidden>กำลังรอคำตอบ</p>
    <div class="chat" id="st-out"></div>
  </main>

  <main class="screen" id="screen-panels" hidden>
    <button type="button" class="block" id="pn-add">เพิ่มช่อง (เลือกรูป)</button>
    <input type="file" accept="image/*" id="pn-file" hidden>
    <p class="error" id="pn-err" hidden></p>
    <p class="muted small" id="pn-busy" hidden>กำลังทำงาน</p>
    <div class="list" id="pn-list"></div>
    <p class="empty" id="pn-empty">ยังไม่มีช่อง</p>
  </main>

  <main class="screen" id="screen-translate" hidden>
    <p class="muted small">เลือกรูปหน้ามังงะแล้วกดแปล ต้องใช้โมเดลที่อ่านรูปได้ รูปจะถูกส่งไปที่ผู้ให้บริการโมเดล</p>
    <button type="button" class="block soft" id="tr-pick">เลือกรูปหน้ามังงะ</button>
    <input type="file" accept="image/*" id="tr-file" hidden>
    <canvas id="tr-canvas" class="canvas-view" hidden></canvas>
    <button type="button" class="block" id="tr-go" disabled>แปลเป็นภาษาไทย</button>
    <p class="error" id="tr-err" hidden></p>
    <p class="muted small" id="tr-busy" hidden>กำลังอ่านและแปล อาจใช้เวลาครู่หนึ่ง</p>
    <p class="muted small" id="tr-done" hidden></p>
  </main>

  <main class="screen" id="screen-settings" hidden>
    <div class="field">
      <label for="key">คีย์ OpenRouter</label>
      <input id="key" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
      <p class="muted small" id="key-state"></p>
    </div>
    <div class="field">
      <label for="model">ชื่อโมเดล</label>
      <input id="model" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ผู้ให้บริการ/ชื่อโมเดล">
      <p class="error" id="set-err" hidden></p>
      <p class="muted small" id="saved" hidden>บันทึกแล้ว</p>
    </div>
    <button type="button" class="block" id="save">บันทึก</button>

    <div class="field">
      <label for="msg">ข้อความทดสอบ</label>
      <textarea id="msg" rows="3"></textarea>
      <p class="error" id="msg-err" hidden></p>
    </div>
    <button type="button" class="block soft" id="send">ส่ง</button>
    <p class="muted small" id="busy" hidden>กำลังรอคำตอบ</p>
    <div class="chat" id="chat"></div>

    <p class="muted small" id="ver"></p>
  </main>

  <div class="scrim" id="confirm" hidden>
    <div class="sheet">
      <h2 id="confirm-title"></h2>
      <p class="muted" id="confirm-text"></p>
      <button type="button" class="danger block" id="confirm-yes">ลบ</button>
      <button type="button" class="soft block" id="confirm-no">ยกเลิก</button>
    </div>
  </div>

  <pre id="err"></pre>

  <nav class="nav" id="nav">
    <button type="button" data-screen="write" aria-current="page">เขียน</button>
    <button type="button" data-screen="story">เรื่อง</button>
    <button type="button" data-screen="panels">ช่อง</button>
    <button type="button" data-screen="translate">แปล</button>
    <button type="button" data-screen="settings">ตั้งค่า</button>
  </nav>

  <script>
    window.addEventListener("error", function (e) {
      document.getElementById("err").textContent += e.message + " (" + e.filename + ":" + e.lineno + ")\n";
    });
    window.addEventListener("unhandledrejection", function (e) {
      document.getElementById("err").textContent += "Promise: " + e.reason + "\n";
    });
  </script>
  <script src="app.js"></script>
  <script src="settings.js"></script>
  <script src="write.js"></script>
  <script src="ui.js"></script>
  <script src="media.js"></script>
  <script src="story.js"></script>
  <script src="panels.js"></script>
  <script src="translate.js"></script>
  <script src="nav.js"></script>
</body>
</html>
